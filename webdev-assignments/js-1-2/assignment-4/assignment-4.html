<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Assignment 4</title>
</head>
<body>
<h1>Sorting hat</h1>
<p id="target"></p>
<script>
    "use strict";
    const name = prompt("What is your name?");
    let print = Math.floor(Math.random() * 4) + 1;
    if (print == 1) {
        print = "Gryffindor";
        } else if (print == 2) {
        print = "Hufflepuff";
        } else if (print == 3) {
        print = "Ravenclaw";
        } else {
        print = "Slytherin";
    }
    document.querySelector("#target").innerHTML = name + ", you are " + print + ".";
</script>
</body>
</html>
