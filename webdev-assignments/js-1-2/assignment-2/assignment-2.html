<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Testing JavaScript</title>
  </head>
  <body>
    <p id="target"></p>
    <script>
      "use strict";
      let name = prompt("What is your name?");
      document.querySelector("#target").innerHTML =
        "Hello, " + name + "!";
    </script>
  </body>
</html>
