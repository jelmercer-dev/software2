<body>
<h1>Numbers in reverse order</h1>
<p>This program prints to the console: open the developer tools (F12) → Console.</p>
<script>
"use strict";
let numbers = [];
for (let i = 0; i < 5; i++) {
  numbers.push(prompt("Enter a number:"));
}
for (let i= numbers.length - 1; i >= 0; i--) {
  console.log(numbers[i]);
}
</script>
</body>
