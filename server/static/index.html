<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calculator</title>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <main class="calculator">
    <h1>Calculator</h1>

    <div class="inputs">
      <label for="number1">First number</label>
      <input type="text" id="number1">

      <label for="number2">Second number</label>
      <input type="text" id="number2" >
    </div>
    <div class="operations">
      <button type="button" data-operation="plus">+</button>
      <button type="button" data-operation="minus">−</button>
      <button type="button" data-operation="multiplication">×</button>
    </div>

    <output id="result"></output>
  </main>

 
</body>
</html>
